<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Podcaster's Forge password was changed</title>
  </head>
  <body style="margin:0;background:#f4f5f7;color:#172033;font-family:Arial,sans-serif;">
    <main style="max-width:600px;margin:0 auto;padding:32px 20px;">
      <section style="background:#ffffff;border:1px solid #dde2ea;border-radius:12px;padding:28px;">
        <h1 style="margin:0 0 16px;font-size:24px;">Your password was changed</h1>
        <p style="margin:0 0 14px;line-height:1.55;">The password for your Podcaster's Forge account was recently changed.</p>
        <p style="margin:0;line-height:1.55;">If you made this change, no action is needed. If you did not, reset your password immediately and contact Forge support.</p>
      </section>
    </main>
  </body>
</html>
