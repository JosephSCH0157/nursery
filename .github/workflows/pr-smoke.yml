name: PR Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pr-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-core:
    name: smoke:core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild @forge/tongs (fresh emit)
        run: |
          rm -f packages/tongs/tsconfig.tsbuildinfo
          pnpm --filter @forge/tongs build
          test -f packages/tongs/dist/index.d.ts

      - name: Run smoke:core
        run: pnpm smoke:core

  smoke-preflight:
    name: smoke:preflight
    runs-on: ubuntu-latest
    outputs:
      smoke_team_ready: ${{ steps.check.outputs.smoke_team_ready }}
      smoke_hearth_phase4_ready: ${{ steps.check.outputs.smoke_hearth_phase4_ready }}
    env:
      NURSERY_SUPABASE_URL: ${{ secrets.NURSERY_SUPABASE_URL }}
      NURSERY_SUPABASE_ANON_KEY: ${{ secrets.NURSERY_SUPABASE_ANON_KEY }}
      NURSERY_SUPABASE_ACCESS_TOKEN: ${{ secrets.NURSERY_SUPABASE_ACCESS_TOKEN }}
      NURSERY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NURSERY_SUPABASE_SERVICE_ROLE_KEY }}
      NURSERY_PLAYWRIGHT_EMAIL: ${{ secrets.NURSERY_PLAYWRIGHT_EMAIL }}
      NURSERY_PLAYWRIGHT_PASSWORD: ${{ secrets.NURSERY_PLAYWRIGHT_PASSWORD }}
      NURSERY_HEARTH_PHASE4_WORKSPACE_ID: ${{ secrets.NURSERY_HEARTH_PHASE4_WORKSPACE_ID }}
      NURSERY_HEARTH_PHASE4_WORKPIECE_ID: ${{ secrets.NURSERY_HEARTH_PHASE4_WORKPIECE_ID }}
    steps:
      - name: Detect provisioned live smoke secrets
        id: check
        shell: bash
        run: |
          smoke_team_ready=true
          smoke_hearth_phase4_ready=true
          missing_team=()
          missing_hearth=()

          if [ -z "${NURSERY_SUPABASE_URL}" ]; then
            missing_team+=("NURSERY_SUPABASE_URL")
            missing_hearth+=("NURSERY_SUPABASE_URL")
          fi

          if [ -z "${NURSERY_SUPABASE_ANON_KEY}" ]; then
            missing_team+=("NURSERY_SUPABASE_ANON_KEY")
            missing_hearth+=("NURSERY_SUPABASE_ANON_KEY")
          fi

          if [ -z "${NURSERY_SUPABASE_SERVICE_ROLE_KEY}" ] && [ -z "${NURSERY_SUPABASE_ACCESS_TOKEN}" ]; then
            missing_team+=("NURSERY_SUPABASE_SERVICE_ROLE_KEY or NURSERY_SUPABASE_ACCESS_TOKEN")
          fi

          if [ -z "${NURSERY_SUPABASE_SERVICE_ROLE_KEY}" ]; then
            missing_hearth+=("NURSERY_SUPABASE_SERVICE_ROLE_KEY")
          fi

          if [ -z "${NURSERY_PLAYWRIGHT_EMAIL}" ]; then
            missing_hearth+=("NURSERY_PLAYWRIGHT_EMAIL")
          fi

          if [ -z "${NURSERY_PLAYWRIGHT_PASSWORD}" ]; then
            missing_hearth+=("NURSERY_PLAYWRIGHT_PASSWORD")
          fi

          if [ -z "${NURSERY_HEARTH_PHASE4_WORKSPACE_ID}" ]; then
            missing_hearth+=("NURSERY_HEARTH_PHASE4_WORKSPACE_ID")
          fi

          if [ -z "${NURSERY_HEARTH_PHASE4_WORKPIECE_ID}" ]; then
            missing_hearth+=("NURSERY_HEARTH_PHASE4_WORKPIECE_ID")
          fi

          if [ "${#missing_team[@]}" -gt 0 ]; then
            smoke_team_ready=false
          fi

          if [ "${#missing_hearth[@]}" -gt 0 ]; then
            smoke_hearth_phase4_ready=false
          fi

          {
            echo "smoke_team_ready=${smoke_team_ready}"
            echo "smoke_hearth_phase4_ready=${smoke_hearth_phase4_ready}"
          } >> "${GITHUB_OUTPUT}"

          join_by_comma() {
            local IFS=", "
            echo "$*"
          }

          {
            echo "## PR smoke preflight"
            if [ "${smoke_team_ready}" = "true" ]; then
              echo "- \`smoke:team\` enabled."
            else
              echo "- \`smoke:team\` skipped; missing: $(join_by_comma "${missing_team[@]}")."
            fi

            if [ "${smoke_hearth_phase4_ready}" = "true" ]; then
              echo "- \`smoke:hearth-phase4\` enabled."
            else
              echo "- \`smoke:hearth-phase4\` skipped; missing: $(join_by_comma "${missing_hearth[@]}")."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  smoke-team:
    name: smoke:team
    runs-on: ubuntu-latest
    if: needs.smoke-preflight.outputs.smoke_team_ready == 'true'
    needs:
      - smoke-core
      - smoke-preflight
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.NURSERY_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.NURSERY_SUPABASE_ANON_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.NURSERY_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NURSERY_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.72.7

      - name: Validate smoke:team secrets
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "Missing required secrets: NURSERY_SUPABASE_URL, NURSERY_SUPABASE_ANON_KEY" >&2
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ] && [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "Missing required secret: set NURSERY_SUPABASE_SERVICE_ROLE_KEY (preferred) or NURSERY_SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi

      - name: Write app env for smoke scripts
        run: |
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
          } > apps/nursery/.env.local

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke:team
        run: pnpm smoke:team

  smoke-hearth-phase4:
    name: smoke:hearth-phase4
    runs-on: ubuntu-latest
    if: needs.smoke-preflight.outputs.smoke_hearth_phase4_ready == 'true'
    needs:
      - smoke-core
      - smoke-preflight
    timeout-minutes: 45
    env:
      CI: "true"
      REQUIRE_HEARTH_PHASE4_SMOKE: "1"
      VITE_SUPABASE_URL: ${{ secrets.NURSERY_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.NURSERY_SUPABASE_ANON_KEY }}
      TONGS_SERVICE_ROLE_KEY: ${{ secrets.NURSERY_SUPABASE_SERVICE_ROLE_KEY }}
      FORGE_CI_AUTH_EMAIL: ${{ secrets.NURSERY_PLAYWRIGHT_EMAIL }}
      FORGE_CI_AUTH_PASSWORD: ${{ secrets.NURSERY_PLAYWRIGHT_PASSWORD }}
      FORGE_TEST_WORKSPACE_ID: ${{ secrets.NURSERY_HEARTH_PHASE4_WORKSPACE_ID }}
      FORGE_TEST_WORKPIECE_ID: ${{ secrets.NURSERY_HEARTH_PHASE4_WORKPIECE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate smoke:hearth-phase4 secrets
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "Missing required secrets: NURSERY_SUPABASE_URL, NURSERY_SUPABASE_ANON_KEY" >&2
            exit 1
          fi
          if [ -z "${TONGS_SERVICE_ROLE_KEY}" ]; then
            echo "Missing required secret: NURSERY_SUPABASE_SERVICE_ROLE_KEY" >&2
            exit 1
          fi
          if [ -z "${FORGE_CI_AUTH_EMAIL}" ] || [ -z "${FORGE_CI_AUTH_PASSWORD}" ]; then
            echo "Missing required secrets: NURSERY_PLAYWRIGHT_EMAIL, NURSERY_PLAYWRIGHT_PASSWORD" >&2
            exit 1
          fi
          if [ -z "${FORGE_TEST_WORKSPACE_ID}" ] || [ -z "${FORGE_TEST_WORKPIECE_ID}" ]; then
            echo "Missing required secrets: NURSERY_HEARTH_PHASE4_WORKSPACE_ID, NURSERY_HEARTH_PHASE4_WORKPIECE_ID" >&2
            exit 1
          fi

      - name: Write app env for Playwright/runtime
        run: |
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
            echo "TONGS_SERVICE_ROLE_KEY=${TONGS_SERVICE_ROLE_KEY}"
          } > apps/nursery/.env.local

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter nursery exec playwright install --with-deps chromium

      - name: Generate Playwright auth state
        run: pnpm --filter nursery generate:playwright:auth

      - name: Run smoke:hearth-phase4
        run: pnpm smoke:hearth-phase4:gate
