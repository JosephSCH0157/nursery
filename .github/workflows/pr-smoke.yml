name: PR Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nursery-fast-gate:
    name: nursery:fast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate:fast

  nursery-production-build:
    name: nursery:build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  nursery-integration-gate:
    name: nursery:integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter nursery exec playwright install --with-deps chromium
      - run: pnpm gate:integration

  barstock-production-gate:
    name: barstock:production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.84.2
      - run: pnpm install --frozen-lockfile
      - name: Assemble and start certified baseline database
        shell: pwsh
        run: |
          $workdir = Join-Path $env:RUNNER_TEMP 'forge-barstock-baseline'
          ./scripts/new-forge-database-workdir.ps1 -OutputPath $workdir -ProjectId nursery -ApiPort 54321 -Lineage baseline
          "FORGE_BARSTOCK_SUPABASE_WORKDIR=$workdir" | Out-File -FilePath $env:GITHUB_ENV -Append
          ./scripts/invoke-forge-database.ps1 -Lineage baseline -Action Start -Workdir $workdir
      - name: Run Barstock production gate
        run: pnpm gate:barstock-release
      - name: Stop disposable local Supabase
        if: always()
        shell: pwsh
        run: |
          if ($env:FORGE_BARSTOCK_SUPABASE_WORKDIR) {
            ./scripts/invoke-forge-database.ps1 -Lineage baseline -Action Stop -Workdir $env:FORGE_BARSTOCK_SUPABASE_WORKDIR
          }

  forge-database-lineage-gate:
    name: database:lineage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.84.2
      - name: Verify frozen database artifacts and lineage rejection
        shell: pwsh
        run: |
          ./scripts/verify-canonical-database-artifacts.ps1
          ./scripts/verify-forge-database-entrypoints.ps1
          ./scripts/test-supabase-lineage-guard.ps1
      - name: Certify fresh baseline and shared tail
        shell: pwsh
        run: ./scripts/invoke-forge-database.ps1 -Lineage baseline -Action CertifyFresh
      - name: Verify financial contracts remain fail closed
        run: >-
          node --test
          packages/tongs/tests/restricted-beta-financial-policy-migration.test.mjs
          packages/tongs/tests/paid-execution-funding-environment-contract.test.mjs
          packages/tongs/tests/openai-failure-loss-environment-isolation.test.mjs
          packages/tongs/tests/openai-failure-loss-operator-control.test.mjs
          packages/tongs/tests/runway-paid-execution-boundary-migration.test.mjs
          packages/tongs/tests/customer-funding-payment-contract.test.mjs
          packages/tongs/tests/standard-customer-financial-certification-migrations.test.mjs

  nursery-media-gate:
    name: nursery:media
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate:media

  nursery-browser-gate:
    name: nursery:browser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      # No remote fixture or provider secrets enter this job.
      FORGE_NONPROD_SUPABASE_PROJECT_REFS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.84.2
      - run: pnpm install --frozen-lockfile
      - name: Prebuild @forge/shared and @forge/tongs (fresh emit)
        run: |
          rm -f packages/shared/tsconfig.tsbuildinfo
          rm -f packages/tongs/tsconfig.tsbuildinfo
          pnpm --filter @forge/shared build
          pnpm --filter @forge/tongs build
          test -f packages/shared/dist/script-tags/index.d.ts
          test -f packages/tongs/dist/index.d.ts
          test -f packages/shared/dist/script-tags/index.js
      - name: Prepare job-owned Supabase configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { randomBytes } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const id = `forge-he3-browser-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const workdir = path.join(process.env.RUNNER_TEMP, id);
          execFileSync('pwsh', [
            '-NoProfile', '-File', 'scripts/new-forge-database-workdir.ps1',
            '-OutputPath', workdir, '-ProjectId', id, '-ApiPort', '58621',
            '-SiteUrl', 'http://127.0.0.1:5173', '-Lineage', 'baseline'
          ], { stdio: ['ignore', 'ignore', 'inherit'] });
          const password = `Fixture-Aa1!${randomBytes(24).toString('hex')}`;
          const tongsToken = randomBytes(32).toString('hex');
          console.log(`::add-mask::${password}`);
          console.log(`::add-mask::${tongsToken}`);
          const values = {
            FORGE_BROWSER_SUPABASE_WORKDIR: workdir,
            FORGE_BROWSER_FIXTURE_EMAIL: `forge-browser-${process.env.GITHUB_RUN_ID}@example.invalid`,
            FORGE_BROWSER_FIXTURE_PASSWORD: password,
            TONGS_API_TOKEN: tongsToken,
            VITE_TONGS_API_TOKEN: tongsToken,
            FORGE_BROWSER_FIXTURE_MANIFEST: path.join(workdir, 'browser-fixtures.v1.json'),
            FORGE_BROWSER_FIXTURE_RECEIPT: path.join(workdir, 'browser-fixtures-verification.v1.json'),
            HEARTH_PHASE4_FIXTURE_ARTIFACT: path.join(workdir, 'hearth-phase4-fixtures.json'),
            PLAYWRIGHT_STORAGE_STATE: path.join(workdir, 'auth-state.json'),
          };
          for (const [key, value] of Object.entries(values)) fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          NODE
      - name: Verify credential-safe startup diagnostics
        run: pnpm --filter nursery exec tsx --test tests/browser-supabase-diagnostics.test.mts
      - name: Start certified baseline Supabase
        run: |
          umask 077
          # CLI startup prints local keys: retain its output privately, never echo it.
          if pwsh -NoProfile -File scripts/invoke-forge-database.ps1 -Lineage baseline -Action Start -Workdir "$FORGE_BROWSER_SUPABASE_WORKDIR" > "$RUNNER_TEMP/browser-supabase-start.log" 2>&1; then
            echo 'Disposable Supabase startup succeeded.'
          else
            status=$?
            echo "Disposable Supabase startup failed (exit $status). Credential-safe diagnostic follows:"
            node apps/nursery/scripts/browser-supabase-diagnostics.mjs "$RUNNER_TEMP/browser-supabase-start.log" "$FORGE_BROWSER_SUPABASE_WORKDIR/supabase/migrations"
            exit "$status"
          fi
      - name: Configure disposable credentials without logging values
        run: |
          umask 077
          supabase status --workdir "$FORGE_BROWSER_SUPABASE_WORKDIR" --output json > "$RUNNER_TEMP/browser-supabase-status.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const file = path.join(process.env.RUNNER_TEMP, 'browser-supabase-status.json');
          const status = JSON.parse(fs.readFileSync(file, 'utf8'));
          assert.equal(new URL(status.API_URL).hostname, '127.0.0.1');
          const values = {
            VITE_SUPABASE_URL: status.API_URL, SUPABASE_URL: status.API_URL, TONGS_SUPABASE_URL: status.API_URL,
            VITE_SUPABASE_ANON_KEY: status.ANON_KEY, SUPABASE_ANON_KEY: status.ANON_KEY, TONGS_SUPABASE_ANON_KEY: status.ANON_KEY,
            TONGS_SERVICE_ROLE_KEY: status.SERVICE_ROLE_KEY, SUPABASE_SERVICE_ROLE_KEY: status.SERVICE_ROLE_KEY,
          };
          for (const [key, value] of Object.entries(values)) {
            assert.equal(typeof value, 'string'); assert.ok(value && !/[\r\n]/.test(value));
            console.log(`::add-mask::${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          fs.unlinkSync(file);
          NODE
      - run: pnpm --filter nursery exec playwright install --with-deps chromium
      - run: pnpm --filter nursery test:browser-fixtures
      - run: pnpm --filter nursery exec tsx --test tests/browser-disposable-isolation.test.mts
      # gate:browser calls browser:prepare exactly once. It provisions, generates
      # auth at 127.0.0.1:5173 and verifies authenticated Storage before Playwright.
      # Playwright loads the manifest's distinct Hearth/Hammer IDs itself; no
      # external base URL is set, so its normal task-owned Vite server starts.
      - run: pnpm gate:browser
      - name: Stop job-owned disposable Supabase
        if: always() && env.FORGE_BROWSER_SUPABASE_WORKDIR != ''
        shell: pwsh
        run: ./scripts/invoke-forge-database.ps1 -Lineage baseline -Action Stop -Workdir $env:FORGE_BROWSER_SUPABASE_WORKDIR

  hammer-production-gates:
    name: hammer:production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Hammer lint gate
        run: pnpm lint:hammer

      - name: Build and verify Hammer production integration
        run: pnpm build:hammer

  hammer-complete-test-gate:
    name: hammer:test-all
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete Hammer test and strict-registration gate
        run: pnpm test:hammer

  hammer-coverage-gate:
    name: hammer:coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete Hammer coverage and no-regression gate
        run: pnpm test:hammer:coverage

  vsm-evolution-check:
    name: vsm:evolution-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Warn when VSM section is missing for VSM-touching PRs
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- vsm-evolution-check -->';
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No PR context; skipping.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const vsmFileMatchers = [
              /(^|\/)apps\/hearth\//i,
              /(^|\/)packages\/shared\/script-tags\//i,
              /(^|\/)HEARTH_VSM_/i,
              /(^|\/)docs\/HEARTH_ANVIL_SCRIPT_TAG_CONTRACT\.md$/i,
              /(^|\/)\.github\/pull_request_template\.md$/i,
            ];

            const touchesVsm = files.some((file) =>
              vsmFileMatchers.some((matcher) => matcher.test(file.filename))
            );
            core.info(`touchesVsm=${touchesVsm}`);
            if (!touchesVsm) return;

            const body = (pr.body || '').toLowerCase();
            const hasNotRelatedChecked = /\-\s*\[[xX]\]\s*not related to vsm/i.test(pr.body || '');
            const hasExpansionLane =
              /\-\s*\[[xX]\]\s*suggestion scaffolds/i.test(pr.body || '') ||
              /\-\s*\[[xX]\]\s*ai assistance/i.test(pr.body || '') ||
              /\-\s*\[[xX]\]\s*organization\/navigation/i.test(pr.body || '') ||
              /\-\s*\[[xX]\]\s*style systems/i.test(pr.body || '') ||
              /\-\s*\[[xX]\]\s*other \(explain\)/i.test(pr.body || '');
            const hasDeterministic =
              /\-\s*\[[xX]\]\s*yes/i.test(pr.body || '') ||
              /\-\s*\[[xX]\]\s*no/i.test(pr.body || '') ||
              /\-\s*\[[xX]\]\s*unclear/i.test(pr.body || '');
            const hasTrustRisk =
              /\-\s*\[[xX]\]\s*low/i.test(pr.body || '') ||
              /\-\s*\[[xX]\]\s*medium/i.test(pr.body || '') ||
              /\-\s*\[[xX]\]\s*high/i.test(pr.body || '');
            const hasMatrixClass =
              /\-\s*\[[xX]\]\s*proceed$/im.test(pr.body || '') ||
              /\-\s*\[[xX]\]\s*proceed with constraints/i.test(pr.body || '') ||
              /\-\s*\[[xX]\]\s*defer/i.test(pr.body || '') ||
              /\-\s*\[[xX]\]\s*reject/i.test(pr.body || '');
            const hasManualOverride = /vsm check intentionally not applicable/i.test(body);

            const sectionComplete =
              hasNotRelatedChecked ||
              (hasExpansionLane && hasDeterministic && hasTrustRisk && hasMatrixClass) ||
              hasManualOverride;

            core.info(`sectionComplete=${sectionComplete}`);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => (comment.body || '').includes(marker));

            if (sectionComplete) {
              if (existing) {
                const completeBody = [
                  marker,
                  "✅ VSM evolution check complete for VSM-touching changes. No action needed.",
                ].join("\n");
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: completeBody,
                });
              }
              return;
            }

            const warningBody = [
              marker,
              "⚠️ **VSM Evolution Check Missing**",
              "",
              "This PR modifies Visual Script Mode related files, but the **VSM Evolution Check** section in the PR body looks incomplete.",
              "",
              "Please classify the change using the matrix at:",
              "`HEARTH_VSM_2_FEATURE_REVIEW_MATRIX.md`",
              "",
              "If not applicable, mark **Not related to VSM** in the PR template.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: warningBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: warningBody,
              });
            }

  smoke-core:
    name: smoke:core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild @forge/shared and @forge/tongs (fresh emit)
        run: |
          rm -f packages/shared/tsconfig.tsbuildinfo
          rm -f packages/tongs/tsconfig.tsbuildinfo
          pnpm --filter @forge/shared build
          pnpm --filter @forge/tongs build
          test -f packages/shared/dist/script-tags/index.d.ts
          test -f packages/tongs/dist/index.d.ts

      - name: Run smoke:core
        run: pnpm smoke:core

  smoke-preflight:
    name: smoke:preflight
    runs-on: ubuntu-latest
    outputs:
      smoke_team_ready: ${{ steps.check.outputs.smoke_team_ready }}
      smoke_hearth_phase4_ready: ${{ steps.check.outputs.smoke_hearth_phase4_ready }}
    env:
      NURSERY_SUPABASE_URL: ${{ secrets.NURSERY_SUPABASE_URL }}
      NURSERY_SUPABASE_ANON_KEY: ${{ secrets.NURSERY_SUPABASE_ANON_KEY }}
      NURSERY_SUPABASE_ACCESS_TOKEN: ${{ secrets.NURSERY_SUPABASE_ACCESS_TOKEN }}
      NURSERY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NURSERY_SUPABASE_SERVICE_ROLE_KEY }}
      NURSERY_PLAYWRIGHT_EMAIL: ${{ secrets.NURSERY_PLAYWRIGHT_EMAIL }}
      NURSERY_PLAYWRIGHT_PASSWORD: ${{ secrets.NURSERY_PLAYWRIGHT_PASSWORD }}
      NURSERY_HEARTH_PHASE4_WORKSPACE_ID: ${{ secrets.NURSERY_HEARTH_PHASE4_WORKSPACE_ID }}
      NURSERY_HEARTH_PHASE4_WORKPIECE_ID: ${{ secrets.NURSERY_HEARTH_PHASE4_WORKPIECE_ID }}
    steps:
      - name: Detect provisioned live smoke secrets
        id: check
        shell: bash
        run: |
          smoke_team_ready=true
          smoke_hearth_phase4_ready=true
          missing_team=()
          missing_hearth=()

          if [ -z "${NURSERY_SUPABASE_URL}" ]; then
            missing_team+=("NURSERY_SUPABASE_URL")
            missing_hearth+=("NURSERY_SUPABASE_URL")
          fi

          if [ -z "${NURSERY_SUPABASE_ANON_KEY}" ]; then
            missing_team+=("NURSERY_SUPABASE_ANON_KEY")
            missing_hearth+=("NURSERY_SUPABASE_ANON_KEY")
          fi

          if [ -z "${NURSERY_SUPABASE_SERVICE_ROLE_KEY}" ] && [ -z "${NURSERY_SUPABASE_ACCESS_TOKEN}" ]; then
            missing_team+=("NURSERY_SUPABASE_SERVICE_ROLE_KEY or NURSERY_SUPABASE_ACCESS_TOKEN")
          fi

          if [ -z "${NURSERY_SUPABASE_SERVICE_ROLE_KEY}" ]; then
            missing_hearth+=("NURSERY_SUPABASE_SERVICE_ROLE_KEY")
          fi

          if [ -z "${NURSERY_PLAYWRIGHT_EMAIL}" ]; then
            missing_hearth+=("NURSERY_PLAYWRIGHT_EMAIL")
          fi

          if [ -z "${NURSERY_PLAYWRIGHT_PASSWORD}" ]; then
            missing_hearth+=("NURSERY_PLAYWRIGHT_PASSWORD")
          fi

          if [ -z "${NURSERY_HEARTH_PHASE4_WORKSPACE_ID}" ]; then
            missing_hearth+=("NURSERY_HEARTH_PHASE4_WORKSPACE_ID")
          fi

          if [ -z "${NURSERY_HEARTH_PHASE4_WORKPIECE_ID}" ]; then
            missing_hearth+=("NURSERY_HEARTH_PHASE4_WORKPIECE_ID")
          fi

          if [ "${#missing_team[@]}" -gt 0 ]; then
            smoke_team_ready=false
          fi

          if [ "${#missing_hearth[@]}" -gt 0 ]; then
            smoke_hearth_phase4_ready=false
          fi

          {
            echo "smoke_team_ready=${smoke_team_ready}"
            echo "smoke_hearth_phase4_ready=${smoke_hearth_phase4_ready}"
          } >> "${GITHUB_OUTPUT}"

          join_by_comma() {
            local IFS=", "
            echo "$*"
          }

          {
            echo "## PR smoke preflight"
            if [ "${smoke_team_ready}" = "true" ]; then
              echo "- \`smoke:team\` enabled."
            else
              echo "- \`smoke:team\` skipped; missing: $(join_by_comma "${missing_team[@]}")."
            fi

            if [ "${smoke_hearth_phase4_ready}" = "true" ]; then
              echo "- \`smoke:hearth-phase4\` enabled."
            else
              echo "- \`smoke:hearth-phase4\` skipped; missing: $(join_by_comma "${missing_hearth[@]}")."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  smoke-team:
    name: smoke:team
    runs-on: ubuntu-latest
    if: needs.smoke-preflight.outputs.smoke_team_ready == 'true'
    needs:
      - smoke-core
      - smoke-preflight
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.NURSERY_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.NURSERY_SUPABASE_ANON_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.NURSERY_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NURSERY_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Validate smoke:team secrets
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "Missing required secrets: NURSERY_SUPABASE_URL, NURSERY_SUPABASE_ANON_KEY" >&2
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ] && [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "Missing required secret: set NURSERY_SUPABASE_SERVICE_ROLE_KEY (preferred) or NURSERY_SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi

      - name: Write app env for smoke scripts
        run: |
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
          } > apps/nursery/.env.local

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke:team
        run: pnpm smoke:team

  smoke-hearth-phase4:
    name: smoke:hearth-phase4
    runs-on: ubuntu-latest
    if: needs.smoke-preflight.outputs.smoke_hearth_phase4_ready == 'true'
    needs:
      - smoke-core
      - smoke-preflight
    timeout-minutes: 45
    env:
      CI: "true"
      REQUIRE_HEARTH_PHASE4_SMOKE: "1"
      VITE_SUPABASE_URL: ${{ secrets.NURSERY_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.NURSERY_SUPABASE_ANON_KEY }}
      TONGS_SERVICE_ROLE_KEY: ${{ secrets.NURSERY_SUPABASE_SERVICE_ROLE_KEY }}
      FORGE_CI_AUTH_EMAIL: ${{ secrets.NURSERY_PLAYWRIGHT_EMAIL }}
      FORGE_CI_AUTH_PASSWORD: ${{ secrets.NURSERY_PLAYWRIGHT_PASSWORD }}
      FORGE_TEST_WORKSPACE_ID: ${{ secrets.NURSERY_HEARTH_PHASE4_WORKSPACE_ID }}
      FORGE_TEST_WORKPIECE_ID: ${{ secrets.NURSERY_HEARTH_PHASE4_WORKPIECE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm

      - name: Validate smoke:hearth-phase4 secrets
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "Missing required secrets: NURSERY_SUPABASE_URL, NURSERY_SUPABASE_ANON_KEY" >&2
            exit 1
          fi
          if [ -z "${TONGS_SERVICE_ROLE_KEY}" ]; then
            echo "Missing required secret: NURSERY_SUPABASE_SERVICE_ROLE_KEY" >&2
            exit 1
          fi
          if [ -z "${FORGE_CI_AUTH_EMAIL}" ] || [ -z "${FORGE_CI_AUTH_PASSWORD}" ]; then
            echo "Missing required secrets: NURSERY_PLAYWRIGHT_EMAIL, NURSERY_PLAYWRIGHT_PASSWORD" >&2
            exit 1
          fi
          if [ -z "${FORGE_TEST_WORKSPACE_ID}" ] || [ -z "${FORGE_TEST_WORKPIECE_ID}" ]; then
            echo "Missing required secrets: NURSERY_HEARTH_PHASE4_WORKSPACE_ID, NURSERY_HEARTH_PHASE4_WORKPIECE_ID" >&2
            exit 1
          fi

      - name: Write app env for Playwright/runtime
        run: |
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
            echo "TONGS_SERVICE_ROLE_KEY=${TONGS_SERVICE_ROLE_KEY}"
          } > apps/nursery/.env.local

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter nursery exec playwright install --with-deps chromium

      - name: Generate Playwright auth state
        run: pnpm --filter nursery generate:playwright:auth

      - name: Run smoke:hearth-phase4
        run: pnpm smoke:hearth-phase4:gate
