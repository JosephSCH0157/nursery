<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Podcaster's Forge - Account</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b14;
        --panel: #0f1726;
        --border: rgba(148, 163, 184, 0.3);
        --text: #e5edf7;
        --muted: #9fb0c5;
        --primary: #60a5fa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 15% 10%, rgba(96, 165, 250, 0.14), transparent 45%), var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #forge-account-root {
        width: min(860px, 100%);
        margin: 0 auto;
        padding: 28px 18px 32px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(1.75rem, 3vw, 2.2rem);
      }
      #account-details {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 12px;
        padding: 16px;
      }
      h2 {
        margin-top: 18px;
        margin-bottom: 8px;
        font-size: 1.1rem;
      }
      h2:first-child {
        margin-top: 0;
      }
      p {
        margin: 0 0 10px;
        color: var(--muted);
      }
      strong {
        color: var(--text);
      }
      button {
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: #fff;
        border: 1px solid transparent;
        border-radius: 999px;
        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
        margin-right: 8px;
        margin-bottom: 8px;
      }
      button:hover {
        filter: brightness(1.05);
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #upgrade-msg {
        margin-top: 6px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main id="forge-account-root">
      <h1>Your Forge Account</h1>
      <section id="account-details">
        <p>Loading your account info...</p>
      </section>
    </main>

    <script src="./forge-config.js"></script>
    <script type="module" src="./forge/account.js"></script>
  </body>
</html>
