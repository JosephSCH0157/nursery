[build]
  base = "."
  command = "pnpm install && pnpm build"
  publish = "apps/nursery/dist"

  [functions]
    directory = "apps/nursery/netlify/functions"

[[redirects]]
  from = "/api/hearth/chat"
  to = "/.netlify/functions/hearth-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/hearth/chat/status"
  to = "/.netlify/functions/hearth-chat-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/hearth/stt"
  to = "/.netlify/functions/hearth-stt"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-keys/connect"
  to = "/.netlify/functions/ai-keys-connect"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-keys/disconnect"
  to = "/.netlify/functions/ai-keys-disconnect"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai-keys/status"
  to = "/.netlify/functions/ai-keys-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/anvil/asr/whisper"
  to = "/.netlify/functions/anvil-whisper"
  status = 200
  force = true

[[redirects]]
  from = "/tongs"
  to = "/.netlify/functions/tongs"
  status = 200
  force = true

[[redirects]]
  from = "/tongs/*"
  to = "/.netlify/functions/tongs/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/anvil/dist/manifest.json"
  to = "/anvil/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
